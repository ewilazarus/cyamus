name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Must equal the rustc version in devbox.json (checked in `verify`).
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain matches devbox.json
        run: |
          devbox=$(jq -r '.packages[]' devbox.json | sed -n 's/^rustc@//p')
          if [ "$devbox" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::RUST_TOOLCHAIN is $RUST_TOOLCHAIN but devbox.json pins rustc@$devbox"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches crate version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cyamus-cli") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $crate in Cargo.toml"
            exit 1
          fi
      # Same commands as `devbox run check`.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p cyamus-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          asset="cyamus-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/$asset" cyamus
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: cyamus-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/* install.sh
