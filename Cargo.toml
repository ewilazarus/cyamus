[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/ewilazarus/cyamus"

[workspace.dependencies]
cyamus-core = { path = "crates/cyamus-core" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0"
toml = "1.1"
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
