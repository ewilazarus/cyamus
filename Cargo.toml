[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/ewilazarus/cyamus"

[workspace.dependencies]
cyamus-core = { path = "crates/cyamus-core" }
cyamus-registry = { path = "crates/cyamus-registry" }
cyamus-daemon = { path = "crates/cyamus-daemon" }
anyhow = "1.0"
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
bytes = "1.12"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustix = { version = "1.1", features = ["process"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0"
toml = "1.1"
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
